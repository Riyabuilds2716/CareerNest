
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Employer | CareerNest</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        nav {
            background: #1f4e79;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav h2 {
            color: white;
            margin-right: auto;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            color: #1f4e79;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #1f4e79;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #163a5c;
        }

        .back {
            display: inline-block;
            margin-top: 18px;
            color: #1f4e79;
            text-decoration: none;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #666;
        }
    </style>
</head>

<body>

    <nav>
        <h2>CareerNest</h2>

        <a href="/">Home</a>
        <a href="/jobs">Jobs</a>
        <a href="/about">About</a>
        <a href="/help">Help & Contact</a>
        <a href="/admin">Dashboard</a>
        <a href="/admin-logout">Logout</a>
    </nav>

    <div class="container">

        <h1>Add Employer</h1>

        <p class="subtitle">
            Add a new employer company to the Job Portal.
        </p>

        <form method="POST">

            <label>Company Name</label>
            <input
                type="text"
                name="company_name"
                placeholder="Enter company name"
                required
            >

            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="Enter company email"
                required
            >

            <label>Phone</label>
            <input
                type="text"
                name="phone"
                placeholder="Enter phone number"
                required
            >

            <label>Address</label>
            <textarea
                name="address"
                placeholder="Enter company address"
            ></textarea>

            <button type="submit">
                Add Employer
            </button>

        </form>

        <a href="/manage-employers" class="back">
            ← Back to Manage Employers
        </a>

    </div>

    <footer>
        © 2026 CareerNest| Admin Dashboard
    </footer>

</body>

</html>
