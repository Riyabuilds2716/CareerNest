
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Employer - CareerNest</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        nav {
            background: #1f4e79;
            padding: 16px 30px;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav h2 {
            color: white;
            margin-right: auto;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .header {
            background: #1f4e79;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .employer-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .employer-icon {
            font-size: 45px;
            text-align: center;
            margin-bottom: 15px;
        }

        .employer-card h2 {
            text-align: center;
            color: #1f4e79;
            margin-bottom: 25px;
        }

        .detail {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .detail strong {
            display: inline-block;
            width: 130px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 18px;
            background: #1f4e79;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        footer {
            margin-top: 60px;
            background: #1f4e79;
            color: white;
            text-align: center;
            padding: 18px;
        }
    </style>
</head>

<body>

<nav>
    <h2>CareerNest</h2>

    <a href="/">Home</a>
    <a href="/jobs">Jobs</a>
    <a href="/about">About</a>
    <a href="/help">Help & Contact</a>
    <a href="/admin">Dashboard</a>
    <a href="/admin-logout">Logout</a>
</nav>

<section class="header">
    <h1>Employer Details</h1>
    <p>View complete employer information.</p>
</section>

<main class="container">

    <div class="employer-card">

        <div class="employer-icon">🏢</div>

        <h2>{{ employer[1] }}</h2>

        <div class="detail">
            <strong>Email:</strong>
            {{ employer[2] }}
        </div>

        <div class="detail">
            <strong>Phone:</strong>
            {{ employer[3] }}
        </div>

        <div class="detail">
            <strong>Address:</strong>
            {{ employer[4] }}
        </div>

        <div class="detail">
            <strong>Created:</strong>
            {{ employer[5] }}
        </div>

        <a href="/manage-employers" class="back-btn">
            ← Back to Employers
        </a>

    </div>

</main>

<footer>
    <p>© 2026 CareerNest | Admin Dashboard</p>
</footer>

</body>
</html>
