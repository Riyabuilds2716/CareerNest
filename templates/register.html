
<!DOCTYPE html>
<html>
<head>
    <title>Job Seeker Registration - CareerNest</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav>
    <h2>CareerNest</h2>

    <a href="/">Home</a>
    <a href="/jobs">Jobs</a>
    <a href="/about">About</a>
    <a href="/help">Help & Contact</a>
    <a href="/register">Job Seeker</a>
    <a href="/login">Login</a>
</nav>


<section class="form-section">

    <h1>Job Seeker Registration</h1>

    <p>Create your account and start finding jobs.</p>

    <form method="POST" action="/register">

        <label for="full_name">Full Name</label>
        <input
            type="text"
            id="full_name"
            name="full_name"
            placeholder="Enter your full name"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label for="phone">Phone Number</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            required
        >

        <label for="qualification">Qualification</label>
        <input
            type="text"
            id="qualification"
            name="qualification"
            placeholder="Enter your qualification"
            required
        >

        <label for="skills">Skills</label>
        <input
            type="text"
            id="skills"
            name="skills"
            placeholder="e.g. Python, HTML, SQL"
        >

        <button type="submit">Register</button>

    </form>

    <p>
        Already have an account?
        <a href="/login">Login here</a>
    </p>

</section>


<footer>
    <p>© 2026 CareerNest | Help & Contact</p>
</footer>

</body>
</html>
