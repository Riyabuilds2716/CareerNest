

<!DOCTYPE html>
<html>
<head>
    <title>Apply for Job - CareerNest</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav>
    <h2>CareerNest</h2>

    <a href="/">Home</a>
    <a href="/jobs">Jobs</a>
    <a href="/about">About</a>
    <a href="/help">Help & Contact</a>
    <a href="/register">Job Seeker</a>
    <a href="/login">Login</a>
</nav>


<section class="form-section">

    <h1>Apply for Job</h1>

    <p>
        You are applying for:
        <strong>{{ job_name.replace('-', ' ') }}</strong>
    </p>

    <form method="POST">

        <label>Full Name</label>
        <input
            type="text"
            name="full_name"
            placeholder="Enter your full name"
            required
        >

        <label>Email</label>
        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label>Phone Number</label>
        <input
            type="tel"
            name="phone"
            placeholder="Enter your phone number"
            required
        >

        <label>Resume</label>
        <input
            type="file"
            name="resume"
        >

        <label>Cover Message</label>
        <textarea
            name="cover_message"
            placeholder="Write a short message about yourself"
        ></textarea>

        <button type="submit">
            Submit Application
        </button>

    </form>

</section>


<footer>
    <p>© 2026 CareerNest | Help & Contact</p>
</footer>

</body>
</html>
