
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Job Seeker - CareerNest</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: #0b2d4d;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
            font-size: 22px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 22px;
            font-weight: bold;
            font-size: 14px;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
            flex: 1;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            color: #0b2d4d;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #0b2d4d;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button,
        .back-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            background: #0b2d4d;
            color: white;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        button:hover,
        .back-btn:hover {
            background: #16476f;
        }

        footer {
            background: #0b2d4d;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 30px;
        }

        @media (max-width: 700px) {

            .navbar {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .navbar a {
                margin: 0 6px;
                font-size: 12px;
            }

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .card {
                padding: 22px;
            }

        }

    </style>

</head>

<body>

    <div class="navbar">

        <h2>
            CareerNest Admin
        </h2>

        <div>

            <a href="/admin">
                Dashboard
            </a>

            <a href="/manage-job-seekers">
                Job Seekers
            </a>

            <a href="/admin-logout">
                Logout
            </a>

        </div>

    </div>


    <div class="container">

        <div class="card">

            <h1>
                Edit Job Seeker
            </h1>

            <form method="POST">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    name="full_name"
                    value="{{ seeker[1] }}"
                    required
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    value="{{ seeker[2] }}"
                    required
                >


                <label>
                    Phone
                </label>

                <input
                    type="text"
                    name="phone"
                    value="{{ seeker[3] }}"
                >


                <label>
                    Qualification
                </label>

                <input
                    type="text"
                    name="qualification"
                    value="{{ seeker[4] or '' }}"
                >


                <label>
                    Skills
                </label>

                <textarea
                    name="skills"
                >{{ seeker[5] or '' }}</textarea>


                <div class="buttons">

                    <button type="submit">
                        Update Job Seeker
                    </button>

                    <a
                        href="/manage-job-seekers"
                        class="back-btn"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>


    <footer>

        © 2026 CareerNest. All Rights Reserved.

    </footer>

</body>

</html>
