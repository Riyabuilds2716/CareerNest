
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employer - CareerNest</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        nav {
            background: #1f4e79;
            padding: 16px 30px;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav h2 {
            color: white;
            margin-right: auto;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .header {
            background: #1f4e79;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #1f4e79;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: #1f4e79;
        }

        footer {
            margin-top: 60px;
            background: #1f4e79;
            color: white;
            text-align: center;
            padding: 18px;
        }
    </style>
</head>

<body>

<nav>
    <h2>CareerNest</h2>

    <a href="/">Home</a>
    <a href="/jobs">Jobs</a>
    <a href="/about">About</a>
    <a href="/help">Help & Contact</a>
    <a href="/admin">Dashboard</a>
    <a href="/admin-logout">Logout</a>
</nav>

<section class="header">
    <h1>Edit Employer</h1>
    <p>Update employer company information.</p>
</section>

<main class="container">

    <div class="form-card">

        <form method="POST">

            <label>Company Name</label>
            <input
                type="text"
                name="company_name"
                value="{{ employer[1] }}"
                required
            >

            <label>Email</label>
            <input
                type="email"
                name="email"
                value="{{ employer[2] }}"
                required
            >

            <label>Phone</label>
            <input
                type="text"
                name="phone"
                value="{{ employer[3] }}"
                required
            >

            <label>Address</label>
            <textarea
                name="address"
                required
            >{{ employer[4] }}</textarea>

            <button type="submit">
                Save Changes
            </button>

        </form>

        <a href="/manage-employers" class="back-btn">
            ← Back to Employers
        </a>

    </div>

</main>

<footer>
    <p>© 2026 CareerNest | Admin Dashboard</p>
</footer>

</body>
</html>
